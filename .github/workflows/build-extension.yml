name: Build Chrome Extension (Paused Until Phase 04)

on:
  workflow_dispatch:

jobs:
  build-extension:
    # Production-hardening governance lock: do not build or publish an
    # extension artifact before Phase 04 release gates are approved.
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify package structure
        run: |
          echo "Listing dist/ directory:"
          ls -la dist/
          
          echo "Listing dist/src/ directory:"
          ls -la dist/src/ || true
          
          echo "Checking manifest.json:"
          test -f dist/manifest.json

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: navix-ai-extension
          path: dist/
