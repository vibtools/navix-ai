name: Build, verify, and release Navix AI

on:
  push:
    branches:
      - main
      - phase-04-release-readiness
      - 'release/v*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navix-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm test

      - name: Build extension and server separately
        run: npm run build

      - name: Package extension only
        run: npm run package:extension

      - name: Verify release artifact and budgets
        run: npm run verify:release

      - name: Production server smoke test
        run: npm run smoke:server

      - name: Upload extension release candidate
        uses: actions/upload-artifact@v4
        with:
          name: navix-ai-extension-release-candidate
          path: |
            release/*.zip
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify release ref matches product version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/verify-tag.mjs
          else
            test "$GITHUB_REF" = "refs/heads/release/v${VERSION}"
          fi

      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: navix-ai-extension-release-candidate
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release upload "$TAG" \
              "release/navix-ai-v${VERSION}.zip#Navix AI Chrome extension" \
              "release/SHA256SUMS#SHA-256 checksums" \
              --clobber
            gh release edit "$TAG" \
              --title "Navix AI v${VERSION}" \
              --notes-file RELEASE_NOTES.md
            exit 0
          fi
          RELEASE_REF_ARGS=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            RELEASE_REF_ARGS=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" \
            "release/navix-ai-v${VERSION}.zip#Navix AI Chrome extension" \
            "release/SHA256SUMS#SHA-256 checksums" \
            "${RELEASE_REF_ARGS[@]}" \
            --title "Navix AI v${VERSION}" \
            --notes-file RELEASE_NOTES.md
