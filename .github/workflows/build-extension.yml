name: Build Chrome Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Create extension package
        run: |
          rm -rf release
          mkdir -p release

          cp manifest.json release/
          cp -r src release/

          if [ -d dist ]; then
            cp -r dist/* release/ || true
          fi

          cd release
          zip -r ../AI-Browser-Copilot-extension.zip .

      - name: Verify manifest
        run: |
          test -f release/manifest.json
          echo "Manifest found"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-Copilot-extension
          path: AI-Browser-Copilot-extension.zip
