name: Build Chrome Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Create clean Chrome extension package
        run: |
          rm -rf release
          mkdir release

          cp manifest.json release/
          cp -r src release/

          if [ -d dist ]; then
            cp -r dist release/dist
          fi

          test -f release/manifest.json
          test -f release/src/background/serviceWorker.js
          test -f release/src/content/contentScript.js

      - name: Verify package structure
        run: |
          test -f release/manifest.json
          test -f release/src/background/serviceWorker.js
          test -f release/src/content/contentScript.js
          find release -maxdepth 2 -type f

      - name: Upload unpacked extension folder
        uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-Copilot-v0.1.0-unpacked
          path: release/
